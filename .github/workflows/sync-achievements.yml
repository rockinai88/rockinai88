name: Sync GitHub achievements

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-achievement-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1

      - name: GraphQL repository-token capability probe
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          query='query($login:String!,$from:DateTime!,$to:DateTime!){user(login:$login){contributionsCollection(from:$from,to:$to){pullRequestContributions(first:1){totalCount nodes{isRestricted pullRequest{merged}}}}}}'
          gh api graphql -f query="$query" -F login=rockinai88 -F from=2026-08-07T00:00:00Z -F to=2026-09-08T23:59:59Z --jq '.data.user.contributionsCollection.pullRequestContributions | {totalCount, sampleRestricted:.nodes[0].isRestricted, sampleMerged:.nodes[0].pullRequest.merged}'

      - name: Regenerate profile README
        run: python3 scripts/generate_profile.py

      - name: Validate generated profile
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 scripts/generate_profile.py --check
          python3 scripts/validate-profile.py
          git diff --check

      - name: Commit verified change only
        shell: bash
        run: |
          if git diff --quiet; then
            echo "PROFILE_ACHIEVEMENTS_NO_CHANGE"
            exit 0
          fi
          git add README.md profile/achievements.json \
            assets/github-achievements-motion.svg \
            assets/github-achievements-motion-light.svg
          if git diff --cached --quiet; then
            echo "PROFILE_ACHIEVEMENTS_NO_STAGED_CHANGE"
            exit 0
          fi
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}"'@users.noreply.github.com'
          git commit -m "chore(profile): sync GitHub achievements"
          git push origin "HEAD:${GITHUB_REF_NAME}"
