<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-label="RockIn AI Factory GitHub achievements: Pull Shark x2, Pair Extraordinaire, YOLO and Quickdraw">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f7fb"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff8c7"/><stop offset=".24" stop-color="#ffd85b"/><stop offset=".58" stop-color="#eaae22"/><stop offset="1" stop-color="#8d5b12"/></linearGradient>
  <linearGradient id="goldEdge" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffe889"/><stop offset="1" stop-color="#ad7118"/></linearGradient>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#36d7ff"/><stop offset=".52" stop-color="#438cff"/><stop offset="1" stop-color="#8b7cff"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#253349" stop-opacity=".78"/><stop offset="1" stop-color="#ffffff" stop-opacity=".25"/></linearGradient>
  <linearGradient id="scanGrad" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <radialGradient id="spot"><stop stop-color="#438cff" stop-opacity=".11"/><stop offset="1" stop-color="#438cff" stop-opacity="0"/></radialGradient>
  <filter id="shadow" x="-50%" y="-50%" width="200%" height="220%"><feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#53657d" flood-opacity=".22"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="7"/></filter>
  <symbol id="cup" viewBox="0 0 128 150">
    <path d="M30 18h68v18c0 34-16 55-34 63-18-8-34-29-34-63z" fill="url(#gold)"/>
    <path d="M31 21h9v24c0 25 10 39 24 47-19-7-33-28-33-56z" fill="#fff" opacity=".16"/>
    <path d="M30 31H12v15c0 21 13 34 32 35" fill="none" stroke="url(#goldEdge)" stroke-width="9" stroke-linecap="round"/>
    <path d="M98 31h18v15c0 21-13 34-32 35" fill="none" stroke="url(#goldEdge)" stroke-width="9" stroke-linecap="round"/>
    <path d="M58 98h12v23H58zM42 121h44v10H42zM30 131h68v12H30z" fill="url(#gold)"/>
  </symbol>
</defs>
<style>
@keyframes f1{0%,100%{transform:translateY(0) rotate(-.7deg)}50%{transform:translateY(-10px) rotate(.8deg)}}
@keyframes f2{0%,100%{transform:translateY(-4px) rotate(.7deg)}50%{transform:translateY(8px) rotate(-.7deg)}}
@keyframes f3{0%,100%{transform:translateY(2px)}50%{transform:translateY(-9px)}}
@keyframes f4{0%,100%{transform:translateY(-2px) rotate(-.6deg)}50%{transform:translateY(9px) rotate(.7deg)}}
@keyframes pulse{0%,100%{opacity:.18}50%{opacity:.58}}
@keyframes scan{0%{transform:translateX(-280px) skewX(-18deg)}58%,100%{transform:translateX(1220px) skewX(-18deg)}}
@keyframes twinkle{0%,100%{opacity:.18}50%{opacity:.85}}
.reveal{opacity:1}
.f1{animation:f1 5.2s ease-in-out 1s infinite;transform-origin:96px 100px}.f2{animation:f2 5.8s ease-in-out 1.1s infinite;transform-origin:96px 100px}.f3{animation:f3 4.9s ease-in-out 1.2s infinite;transform-origin:96px 100px}.f4{animation:f4 5.5s ease-in-out 1.3s infinite;transform-origin:96px 100px}
.pulse{animation:pulse 3.4s ease-in-out infinite}.scan{animation:scan 8s ease-in-out infinite}.twinkle{animation:twinkle 3.2s ease-in-out infinite}.t2{animation-delay:1.1s}.t3{animation-delay:2.2s}
@media (prefers-reduced-motion:reduce){.f1,.f2,.f3,.f4,.pulse,.scan,.twinkle{animation:none!important;opacity:1!important}}
</style>
<rect width="980" height="520" rx="30" fill="url(#bg)"/><rect x="18" y="18" width="944" height="484" rx="24" fill="none" stroke="#d8e0ec"/>
<ellipse cx="490" cy="378" rx="420" ry="145" fill="url(#spot)"/><path d="M94 414 886 414 830 470 150 470z" fill="#e9eef6" stroke="#c8d2e1"/><path d="M150 430H830M190 446H790M235 460H745" stroke="#cbd5e2" opacity=".62"/><path d="M245 414 286 470M395 414 420 470M585 414 560 470M735 414 694 470" stroke="#cbd5e2" opacity=".48"/>
<circle class="twinkle" cx="834" cy="79" r="2.4" fill="#36d7ff"/><circle class="twinkle t2" cx="875" cy="104" r="1.8" fill="#8b7cff"/><circle class="twinkle t3" cx="806" cy="122" r="1.6" fill="#fff"/>
<text x="64" y="72" fill="#111827" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="900" letter-spacing="2">GITHUB ACHIEVEMENTS</text>
<text x="64" y="101" fill="#596579" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Verified RockIn AI Factory milestones</text><path d="M64 130H916" stroke="#d8e0ec"/>
<g transform="translate(88 150)"><g class="reveal d1"><path d="M22 234h148l-17 30H39z" fill="url(#glass)" stroke="#c7d2e2"/><ellipse class="pulse" cx="96" cy="251" rx="76" ry="18" fill="#36d7ff"/><g class="f1" filter="url(#shadow)"><use href="#cup" x="32" y="12" width="128" height="150"/><circle cx="96" cy="84" r="20" fill="#eef3f9"/><path d="M79 91c13-18 28-22 39-18-9 4-12 11-10 19-10-6-19-6-29-1z" fill="#36d7ff"/><circle cx="151" cy="28" r="22" fill="#1f8cff"/><text x="151" y="35" text-anchor="middle" fill="#fff" font-size="16" font-family="Arial" font-weight="900">x2</text></g><text x="96" y="294" text-anchor="middle" fill="#111827" font-size="17" font-family="Inter,Segoe UI,Arial" font-weight="800">Pull Shark</text></g></g>
<g transform="translate(303 150)"><g class="reveal d2"><path d="M22 234h148l-17 30H39z" fill="url(#glass)" stroke="#c7d2e2"/><ellipse class="pulse" cx="96" cy="251" rx="76" ry="18" fill="#8b7cff"/><g class="f2" filter="url(#shadow)"><use href="#cup" x="32" y="12" width="128" height="150"/><circle cx="96" cy="84" r="20" fill="#eef3f9"/><circle cx="89" cy="84" r="8" fill="none" stroke="#8b7cff" stroke-width="5"/><circle cx="103" cy="84" r="8" fill="none" stroke="#36d7ff" stroke-width="5"/></g><text x="96" y="294" text-anchor="middle" fill="#111827" font-size="15.5" font-family="Inter,Segoe UI,Arial" font-weight="800">Pair Extraordinaire</text></g></g>
<g transform="translate(518 150)"><g class="reveal d3"><path d="M22 234h148l-17 30H39z" fill="url(#glass)" stroke="#c7d2e2"/><ellipse class="pulse" cx="96" cy="251" rx="76" ry="18" fill="#f7c948"/><g class="f3" filter="url(#shadow)"><use href="#cup" x="32" y="12" width="128" height="150"/><circle cx="96" cy="84" r="20" fill="#eef3f9"/><path d="M96 68l5 10 11 2-8 8 2 11-10-5-10 5 2-11-8-8 11-2z" fill="#f7c948"/></g><text x="96" y="294" text-anchor="middle" fill="#111827" font-size="17" font-family="Inter,Segoe UI,Arial" font-weight="800">YOLO</text></g></g>
<g transform="translate(733 150)"><g class="reveal d4"><path d="M22 234h148l-17 30H39z" fill="url(#glass)" stroke="#c7d2e2"/><ellipse class="pulse" cx="96" cy="251" rx="76" ry="18" fill="#36d7ff"/><g class="f4" filter="url(#shadow)"><use href="#cup" x="32" y="12" width="128" height="150"/><circle cx="96" cy="84" r="20" fill="#eef3f9"/><path d="M101 63 83 85h12l-6 21 22-28H99z" fill="url(#brand)"/></g><text x="96" y="294" text-anchor="middle" fill="#111827" font-size="17" font-family="Inter,Segoe UI,Arial" font-weight="800">Quickdraw</text></g></g>
<rect class="scan" x="-280" y="142" width="210" height="285" fill="url(#scanGrad)" opacity=".32"/>
<path d="M82 482H898" stroke="url(#brand)" stroke-width="2" opacity=".7"/><text x="490" y="503" text-anchor="middle" fill="#6b778c" font-family="Inter,Segoe UI,Arial" font-size="12" letter-spacing="2.2">BUILD  |  VERIFY  |  SHIP</text>
</svg>