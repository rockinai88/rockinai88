<style>@keyframes f1{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-10px) rotate(1deg)}}@keyframes f2{0%,100%{transform:translateY(-3px) rotate(1deg)}50%{transform:translateY(8px) rotate(-1deg)}}@keyframes f3{0%,100%{transform:translateY(2px)}50%{transform:translateY(-9px)}}@keyframes f4{0%,100%{transform:translateY(-2px) rotate(-1deg)}50%{transform:translateY(9px) rotate(1deg)}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.9}}.f1{animation:f1 5.2s ease-in-out infinite;transform-origin:center}.f2{animation:f2 5.8s ease-in-out infinite;transform-origin:center}.f3{animation:f3 4.9s ease-in-out infinite;transform-origin:center}.f4{animation:f4 5.5s ease-in-out infinite;transform-origin:center}.pulse{animation:pulse 3.2s ease-in-out infinite}@media (prefers-reduced-motion:reduce){.f1,.f2,.f3,.f4,.pulse{animation:none}}</style>
